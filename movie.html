<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilmHub — Фільм</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
header{background:#121218;padding:18px 7%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:800;color:#e50914}
.back{color:#fff;text-decoration:none;background:#22222b;padding:10px 16px;border-radius:10px}
main{max-width:900px;margin:50px auto;padding:20px}
.card{background:#15151d;border-radius:18px;padding:35px;box-shadow:0 10px 40px #0008}
h1{font-size:42px;margin:0 0 15px}
.meta{color:#ccc;font-size:18px;margin-bottom:25px}
.desc{color:#ddd;font-size:18px;line-height:1.7}
.watch{display:inline-block;margin-top:25px;background:#e50914;color:white;text-decoration:none;padding:14px 24px;border-radius:10px;font-weight:bold}
.note{margin-top:30px;color:#999;font-size:14px}
@media(max-width:600px){main{margin:20px auto}.card{padding:25px}h1{font-size:32px}}

.player-wrap{margin:25px 0;background:#050507;border-radius:14px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.player{width:100%;height:100%;display:block;background:#000}
.player-placeholder{text-align:center;padding:30px;color:#aaa}
.play-icon{font-size:55px;color:#e50914;margin-bottom:12px}
.player-title{font-size:22px;font-weight:bold;color:#fff;margin-bottom:8px}
.player-subtitle{font-size:15px;line-height:1.5}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
.actions .watch,.actions .back{margin-top:0}
</style>
</head>
<body>
<header>
<div class="logo">FilmHub</div>
<a class="back" href="index.html">← Назад</a>
</header>
<main>
  <div class="card">
    <h1 id="title">Фільм</h1>
    <div class="meta" id="meta"></div>

    <div class="player-wrap" id="playerWrap">
      <div class="player-placeholder">
        <div class="play-icon">▶</div>
        <div class="player-title">Відео ще не підключено</div>
        <div class="player-subtitle">Тут можна показувати трейлер або відео з легального джерела.</div>
      </div>
    </div>

    <p class="desc" id="description"></p>

    <div class="actions">
      <a class="watch" href="#" id="watch" target="_blank" rel="noopener noreferrer">
        ▶ Відкрити легальне джерело
      </a>
      <a class="back" href="index.html">← Назад до каталогу</a>
    </div>
  </div>
</main>

<script>
const p = new URLSearchParams(location.search);
const name = p.get("name") || "Фільм";
const year = p.get("year") || "";
const rating = p.get("rating") || "";
const genre = p.get("genre") || "";
const description = p.get("description") || "Опис фільму буде додано пізніше.";
const video = p.get("video") || "";
const source = p.get("source") || "";

document.getElementById("title").textContent = name;
document.getElementById("meta").textContent =
  (year ? year + " • " : "") +
  (rating ? "⭐ " + rating + " • " : "") +
  genre;
document.getElementById("description").textContent = description;

const playerWrap = document.getElementById("playerWrap");
const watch = document.getElementById("watch");

if (video) {
  playerWrap.innerHTML =
    '<video class="player" controls playsinline preload="metadata">' +
    '<source src="' + video.replace(/"/g, '&quot;') + '" type="video/mp4">' +
    'Ваш браузер не підтримує відео.' +
    '</video>';
}

if (source) {
  watch.href = source;
} else {
  watch.removeAttribute("href");
  watch.removeAttribute("target");
  watch.onclick = (e) => {
    e.preventDefault();
    alert("Для цього фільму ще не додано легальне джерело перегляду.");
  };
}

document.title = "FilmHub — " + name;
</script>
</body>
</html>
