<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilmHub — Фільм</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
header{background:#121218;padding:18px 7%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:800;color:#e50914}
.back{color:#fff;text-decoration:none;background:#22222b;padding:10px 16px;border-radius:10px}
main{max-width:950px;margin:40px auto;padding:20px}
.card{background:#15151d;border-radius:18px;padding:30px;box-shadow:0 10px 40px #0008}
h1{font-size:42px;margin:0 0 15px}
.meta{color:#ccc;font-size:18px;margin-bottom:25px}
.desc{color:#ddd;font-size:18px;line-height:1.7}
.player{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.watch,.backbtn{display:inline-block;color:#fff;text-decoration:none;padding:13px 20px;border-radius:10px;font-weight:bold}
.watch{background:#e50914}.backbtn{background:#292933}
.note{color:#888;font-size:14px;margin-top:25px}
@media(max-width:600px){h1{font-size:32px}.card{padding:20px}}
</style>
</head>
<body>
<header>
  <div class="logo">FilmHub</div>
  <a class="back" href="index.html">← Назад</a>
</header>
<main>
<div class="card">
  <h1 id="title">Фільм</h1>
  <div class="meta" id="meta"></div>
  <div id="player"></div>
  <p class="desc" id="description"></p>
  <div class="actions">
    <a class="watch" id="source" target="_blank" rel="noopener noreferrer">▶ Відкрити трейлер на YouTube</a>
    <a class="backbtn" href="index.html">← Назад до каталогу</a>
  </div>
  <div class="note">На сторінці використовується трейлер, а не повна копія фільму.</div>
</div>
</main>
<script>
const p = new URLSearchParams(location.search);
const name = p.get("name") || "Фільм";
const year = p.get("year") || "";
const rating = p.get("rating") || "";
const genre = p.get("genre") || "";
const description = p.get("description") || "";
const youtube = p.get("youtube") || "";

document.getElementById("title").textContent = name;
document.getElementById("meta").textContent =
  (year ? year + " • " : "") + (rating ? "⭐ " + rating + " • " : "") + genre;
document.getElementById("description").textContent = description;
document.title = "FilmHub — " + name;

const player = document.getElementById("player");
const source = document.getElementById("source");

if (youtube) {
  player.innerHTML = '<iframe class="player" src="https://www.youtube.com/embed/' +
    encodeURIComponent(youtube) +
    '?rel=0" title="Офіційний трейлер" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
  source.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(youtube);
} else {
  player.innerHTML = '<div style="aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#050507;border-radius:14px;color:#aaa">Трейлер ще не додано</div>';
  source.removeAttribute("href");
}
</script>
</body>
</html>
